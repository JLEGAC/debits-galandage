name: Tests et publication Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Tests de la PWA
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tester
        run: npm test

  deploy:
    name: Publier GitHub Pages
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6
      - name: Préparer le site statique
        run: |
          mkdir _site
          cp -R assets data src _site/
          cp index.html styles.css manifest.webmanifest service-worker.js _site/
          touch _site/.nojekyll
      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v5
